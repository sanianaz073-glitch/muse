# Render Blueprint — AllWA multi-user WhatsApp panel
# Free web service tier. The service sleeps when idle on the free plan;
# point an external uptime pinger (e.g. UptimeRobot) at https://<your-service>.onrender.com/health
# every ~10 minutes to keep it awake.
#
# Before deploying, create a free MongoDB Atlas cluster and set MONGODB_URI
# in the Render dashboard (placeholder below, sync: false = you fill it in).
# Without MongoDB the free instance's disk is ephemeral: Baileys auth state
# and panel data would be lost on every restart/redeploy and every user
# would have to scan the QR again.
services:
  - type: web
    name: allwa-panel
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is set automatically by Render — server.js reads process.env.PORT.
      - key: MONGODB_URI
        sync: false # <-- paste your MongoDB Atlas connection string in the dashboard
      # Optional in this VM only: outbound proxy for the WhatsApp socket.
      # On Render, direct egress works, so leave these unset there.
      # - key: https_proxy
      #   sync: false
